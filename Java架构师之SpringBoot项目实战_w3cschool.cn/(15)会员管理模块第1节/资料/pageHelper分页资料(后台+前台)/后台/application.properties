#配置tomcat服务器的端口号
server.port=8888

#配置数据源的核心类
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
#配置数据库连接基本属性：driver、url、username、password
spring.datasource.driver-class-name=com.p6spy.engine.spy.P6SpyDriver
spring.datasource.url=jdbc:p6spy:mysql://localhost:3306/invoicing?useSSL=false
spring.datasource.username=root
spring.datasource.password=root
#配置数据库连接池的详细信息
spring.datasource.initialSize=1
spring.datasource.minIdle=5
spring.datasource.maxActive=20
spring.datasource.maxWait=60000
spring.datasource.timeBetweenEvictionRunMillis=60000
spring.datasource.minEvictableIdleTimeMillis=30000
spring.datasource.testWhileIdle=false

#开放springboot下的静态资源访问，如果不指定，则静态资源不能直接访问
spring.mvc.static-path-pattern=/static/**

#配置视图解析器
spring.mvc.view.prefix=/pages/
spring.mvc.view.suffix=


#配置mybatis扫描局部的xml配置文件
mybatis.mapper-locations=classpath:mapping/*.xml
mybatis.type-aliases-package=cn.java.entity

#配置文件上传
#配置单个文件的上传大小
spring.http.multipart.maxFileSize=1048576
#配置总文件的上传大小
spring.http.multipart.maxRequestSize=10485760


#配置pageHelper分页插件
#指定数据库类型(mysql、oracle、sqlserver)
pagehelper.helperDialect=mysql
pagehelper.reasonable=true
pagehelper.supportMethodsArguments=true
#指定pageHelper统计某张表中的总记录数
pagehelper.params=count=countSql